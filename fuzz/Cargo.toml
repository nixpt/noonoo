[package]
name = "noonoo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "Noonoo fuzz targets (cargo-fuzz, nightly-only)."

# Deliberately OUTSIDE the noonoo workspace (root `exclude`): `libfuzzer-sys`
# and the sanitizer runtime are fuzzing-only tooling and must never enter the
# engine lockfile.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
noonoo-css = { path = "../crates/noonoo-css" }
noonoo-html = { path = "../crates/noonoo-html" }
noonoo-json = { path = "../crates/noonoo-json" }
noonoo-toml = { path = "../crates/noonoo-toml" }

[profile.release]
debug = 1
codegen-units = 1

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false

[[bin]]
name = "toml"
path = "fuzz_targets/toml.rs"
test = false
doc = false
