[package]
name = "vaji-core"
description = "Vaji core: the document tree, style resolution, and the layout pipeline."
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = []

# Engine backends. Declared up front so downstreams can select a profile, but
# wired in later slices (see docs/ROADMAP.md). The borrow boundary they define
# is described in docs/DEPENDENCIES.md — the point of these flags is that a
# build that does not need a backend does not pay for it.
stylo = []   # Servo CSS engine: parse + cascade + computed values
taffy = []   # Layout: flexbox + grid
parley = []  # Text: shaping + line breaking + font management
headless = [] # Tree dump + virtual clock + synthetic input, no display

[dependencies]
