[package]
name = "vaji"
description = "Vaji: a modular HTML/CSS rendering engine, and the `vaji` command line."
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "vaji"

[features]
default = ["std"]
std = ["vaji-dom/std", "vaji-paint/std", "vaji-net/std"]
headless = ["dep:vaji-headless"]
window = ["vaji-shell/window"]
gpu = ["vaji-shell/gpu"]
http = ["vaji-net/http"]

[dependencies]
vaji-engine.workspace = true
vaji-dom.workspace = true
vaji-events.workspace = true
vaji-headless = { workspace = true, optional = true }
vaji-html.workspace = true
vaji-layout.workspace = true
vaji-motion.workspace = true
vaji-net.workspace = true
vaji-paint.workspace = true
vaji-shell.workspace = true
vaji-style.workspace = true
vaji-text.workspace = true

[[bin]]
name = "vaji"
path = "src/main.rs"
