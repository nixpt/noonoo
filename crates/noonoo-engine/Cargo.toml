[package]
name = "noonoo-engine"
description = "Noonoo's orchestration: a parsed, styleable, layable engine over a DOM document."
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = []
# Pull in the borrowed-engine layers (style + layout + html). Without them the
# engine is a bare DOM document; with them it resolves like a browser page.
resolve = ["dep:noonoo-style", "dep:noonoo-layout", "dep:noonoo-html"]

[dependencies]
noonoo-dom.workspace = true
noonoo-events = { workspace = true, optional = true }
noonoo-net = { workspace = true, optional = true }
noonoo-style = { workspace = true, optional = true }
noonoo-layout = { workspace = true, optional = true }
noonoo-html = { workspace = true, optional = true }
