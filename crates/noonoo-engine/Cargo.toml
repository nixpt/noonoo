[package]
name = "noonoo-engine"
description = "Noonoo's orchestration: a parsed, styled, layable engine over a DOM document."
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = []
# Pull in the layout layer. Style is always on (we own it); layout lands next.
resolve = ["dep:noonoo-layout"]

[dependencies]
noonoo-dom.workspace = true
noonoo-html.workspace = true
noonoo-css.workspace = true
noonoo-style.workspace = true
noonoo-layout = { workspace = true, optional = true }
