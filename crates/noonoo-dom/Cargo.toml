[package]
name = "noonoo-dom"
description = "Noonoo's document tree: stable node identity, mutation, and queries."
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]
# Path only, no version: noonoo-html depends on noonoo-dom, so `cargo publish`
# must strip this dev-dependency (it does for versionless ones) or the two
# could never be uploaded in an order crates.io accepts.
noonoo-html = { path = "../noonoo-html" }
