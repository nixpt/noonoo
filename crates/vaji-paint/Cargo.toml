[package]
name = "vaji-paint"
description = "Vaji paint: layout boxes into a backend-agnostic render command stream."
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = []

# Rendering backends. The command stream is backend-neutral; these select what
# consumes it.
render = [] # GPU/CPU rasterizer (anyrender)
svg = []    # SVG rendering

[dependencies]
vaji-core.workspace = true
