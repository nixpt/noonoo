[package]
name = "noonoo-vello"
version = "0.20.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Opt-in: render a Noonoo command stream with Vello (GPU)."

# Deliberately OUTSIDE the noonoo workspace (see the root `exclude`): it pulls
# Vello, which the engine's default build and lockfile must not pay for.
[dependencies]
noonoo-paint = { path = "../../crates/noonoo-paint" }
noonoo-geometry = { path = "../../crates/noonoo-geometry" }
noonoo-ttf = { path = "../../crates/noonoo-ttf" }
vello = { version = "0.7", default-features = false }
# Decode `DrawImage` images (PNG also carries colour emoji glyphs): codecs are
# bought, not built (docs/DEPENDENCY-EXIT.md). All four are pure Rust.
png = "0.17"
zune-jpeg = "0.4"
zune-core = "0.4"
gif = "0.14"
image-webp = "0.2"

[dev-dependencies]
# Names `Patch`, to look at the images a scene carries.
vello_encoding = "0.7"
