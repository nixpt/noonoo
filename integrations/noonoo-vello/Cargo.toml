[package]
name = "noonoo-vello"
version = "0.20.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixpt/noonoo"
categories = ["gui", "rendering", "web-programming"]
rust-version = "1.89"
description = "Opt-in: render a Noonoo command stream with Vello (GPU)."
readme = "README.md"

# Deliberately OUTSIDE the noonoo workspace (see the root `exclude`): it pulls
# Vello, which the engine's default build and lockfile must not pay for.
[dependencies]
noonoo-paint = { path = "../../crates/noonoo-paint", version = "0.20.0" }
noonoo-geometry = { path = "../../crates/noonoo-geometry", version = "0.20.0" }
noonoo-ttf = { path = "../../crates/noonoo-ttf", version = "0.20.0" }
vello = { version = "0.7", default-features = false }
# Decode `DrawImage` images (PNG also carries colour emoji glyphs): codecs are
# bought, not built (docs/DEPENDENCY-EXIT.md). All four are pure Rust.
png = "0.17"
zune-jpeg = "0.4"
zune-core = "0.4"
gif = "0.14"
image-webp = "0.2"

[dev-dependencies]
# Names `Patch`, to look at the images a scene carries.
vello_encoding = "0.7"
