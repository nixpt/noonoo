[package]
name = "api-snapshot"
version = "0.0.1"
edition = "2021"
publish = false
description = "Vaji tooling: rustdoc JSON -> api-drift snapshot, and snapshot diff."

# Deliberately OUTSIDE the vaji workspace (see the workspace `exclude`): the
# engine build must not pay for serde_json or the api-drift path dep.
[dependencies]
api-drift = { path = "../../../../api-drift/crates/api-drift", features = ["producer", "serde"] }

[[bin]]
name = "api-snapshot"
path = "src/snapshot.rs"

[[bin]]
name = "api-diff"
path = "src/diff.rs"
