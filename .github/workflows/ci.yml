name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: check
        run: cargo check --workspace --all-targets --all-features
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: bench smoke
        run: cargo run --manifest-path tools/bench/Cargo.toml -- --bytes 4096 --iters 1
      - name: fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  integrations:
    # Outside the workspace (each pulls a heavy dependency the engine's
    # build must not pay for), so the jobs above never build them.
    name: integration (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # noonoo-xip is left out: it builds against the private, unpublished
        # xip-core through a local path, which a runner can't reach.
        crate: [noonoo-vello, noonoo-winit, noonoo-accesskit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/${{ matrix.crate }}
      - name: system libraries
        if: matrix.crate == 'noonoo-winit'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: fmt
        run: cargo fmt --manifest-path integrations/${{ matrix.crate }}/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path integrations/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path integrations/${{ matrix.crate }}/Cargo.toml

  msrv:
    name: msrv (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --workspace --all-targets
