[workspace]
resolver = "3"
members = [
    # foundation — no borrowed engines
    "crates/noonoo-dom",
    "crates/noonoo-events",
    "crates/noonoo-text",
    "crates/noonoo-motion",
    "crates/noonoo-geometry",
    # parsers — owned syntax layers, dependency-free
    "crates/noonoo-parse",
    "crates/noonoo-json",
    "crates/noonoo-css",
    "crates/noonoo-selectors",
    "crates/noonoo-query",
    "crates/noonoo-caison",
    "crates/noonoo-html",
    "crates/noonoo-markdown",
    "crates/noonoo-csv",
    "crates/noonoo-ini",
    "crates/noonoo-toml",
    "crates/noonoo-xml",
    "crates/noonoo-ttf",
    "crates/noonoo-svg",
    # engine — one borrowed engine per crate, one module per boundary
    "crates/noonoo-style",
    "crates/noonoo-layout",
    "crates/noonoo-a11y",
    "crates/noonoo-net",
    # orchestration
    "crates/noonoo-engine",
    "crates/noonoo-headless",
    # higher layers
    "crates/noonoo-hx",
    # policy — capability gating
    "crates/noonoo-caps",
    # output
    "crates/noonoo-paint",
    "crates/noonoo-shell",
    # facade
    "crates/noonoo",
]
# tools/ is deliberately outside the workspace: the api-snapshot helper pulls
# serde_json and the api-drift path dep, which the engine build must not pay for.
exclude = ["tools/api-snapshot", "tools/bench", "tools/bliss-diff", "tools/chromium-diff", "fuzz", "integrations/noonoo-xip",
    "integrations/noonoo-vello", "integrations/noonoo-winit", "integrations/noonoo-accesskit",]

# Noonoo is a clean-room reimplementation. Nothing here depends on the code of
# the engine it replaces (bliss-engine / upstream Blitz), and the engines that
# would have been borrowed were re-owned instead: the CSS layer (tokenizer,
# selectors, value/property model, the cascade), layout (block, inline, flex,
# grid, floats), text line-breaking, the paint command stream, the font
# file parser, and the accessibility tree are all workspace crates. The
# workspace has **zero third-party dependencies**; what is borrowed stays
# borrowed deliberately - GPU rasterization (vello/wgpu), windowing (winit),
# and the a11y protocol (accesskit) - behind the opt-in integrations in
# `integrations/`, which are excluded above so the engine's lockfile never
# carries them. See ARCHITECTURE.md and docs/DEPENDENCIES.md.

[workspace.package]
version = "0.20.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nixpt/noonoo"
repository = "https://github.com/nixpt/noonoo"
categories = ["gui", "rendering", "web-programming"]
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
noonoo-parse = { path = "crates/noonoo-parse", version = "0.20.0" }
noonoo-json = { path = "crates/noonoo-json", version = "0.20.0" }
noonoo-css = { path = "crates/noonoo-css", version = "0.20.0" }
noonoo-selectors = { path = "crates/noonoo-selectors", version = "0.20.0" }
noonoo-query = { path = "crates/noonoo-query", version = "0.20.0" }
noonoo-caison = { path = "crates/noonoo-caison", version = "0.20.0" }
noonoo-dom = { path = "crates/noonoo-dom", version = "0.20.0" }
noonoo-events = { path = "crates/noonoo-events", version = "0.20.0" }
noonoo-text = { path = "crates/noonoo-text", version = "0.20.0" }
noonoo-motion = { path = "crates/noonoo-motion", version = "0.20.0" }
noonoo-geometry = { path = "crates/noonoo-geometry", version = "0.20.0" }
noonoo-style = { path = "crates/noonoo-style", version = "0.20.0" }
noonoo-layout = { path = "crates/noonoo-layout", version = "0.20.0" }
noonoo-a11y = { path = "crates/noonoo-a11y", version = "0.20.0" }
noonoo-html = { path = "crates/noonoo-html", version = "0.20.0" }
noonoo-markdown = { path = "crates/noonoo-markdown", version = "0.20.0" }
noonoo-csv = { path = "crates/noonoo-csv", version = "0.20.0" }
noonoo-ini = { path = "crates/noonoo-ini", version = "0.20.0" }
noonoo-toml = { path = "crates/noonoo-toml", version = "0.20.0" }
noonoo-xml = { path = "crates/noonoo-xml", version = "0.20.0" }
noonoo-ttf = { path = "crates/noonoo-ttf", version = "0.20.0" }
noonoo-svg = { path = "crates/noonoo-svg", version = "0.20.0" }
noonoo-net = { path = "crates/noonoo-net", version = "0.20.0" }
noonoo-engine = { path = "crates/noonoo-engine", version = "0.20.0" }
noonoo-headless = { path = "crates/noonoo-headless", version = "0.20.0" }
noonoo-hx = { path = "crates/noonoo-hx", version = "0.20.0" }
noonoo-caps = { path = "crates/noonoo-caps", version = "0.20.0" }
noonoo-paint = { path = "crates/noonoo-paint", version = "0.20.0" }
noonoo-shell = { path = "crates/noonoo-shell", version = "0.20.0" }

[profile.release]
lto = true
codegen-units = 1
strip = true
