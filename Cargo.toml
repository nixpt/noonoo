[workspace]
resolver = "3"
members = [
    # foundation — no borrowed engines
    "crates/noonoo-dom",
    "crates/noonoo-events",
    "crates/noonoo-text",
    "crates/noonoo-motion",
    # parsers — owned syntax layers, dependency-free
    "crates/noonoo-parse",
    "crates/noonoo-json",
    "crates/noonoo-css",
    "crates/noonoo-caison",
    "crates/noonoo-html",
    # engine — one borrowed engine per crate, one module per boundary
    "crates/noonoo-style",
    "crates/noonoo-layout",
    "crates/noonoo-net",
    # orchestration
    "crates/noonoo-engine",
    "crates/noonoo-headless",
    # output
    "crates/noonoo-paint",
    "crates/noonoo-shell",
    # facade
    "crates/noonoo",
]
# tools/ is deliberately outside the workspace: the api-snapshot helper pulls
# serde_json and the api-drift path dep, which the engine build must not pay for.
exclude = ["tools/api-snapshot"]

# Noonoo is a clean-room reimplementation. Nothing here depends on the code of
# the engine it replaces (bliss-engine / upstream Blitz); the third-party
# engines we *do* rely on (stylo, taffy, parley, anyrender/vello, winit) are
# ordinary crates.io deps, pinned in one place and kept behind bounded modules.
# See docs/DEPENDENCIES.md, ARCHITECTURE.md, and docs/CONSUMERS.md.

[workspace.package]
version = "0.0.1"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nixpt/noonoo"
repository = "https://github.com/nixpt/noonoo"
categories = ["gui", "rendering", "web-programming"]
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
noonoo-parse = { path = "crates/noonoo-parse", version = "0.0.1" }
noonoo-json = { path = "crates/noonoo-json", version = "0.0.1" }
noonoo-css = { path = "crates/noonoo-css", version = "0.0.1" }
noonoo-caison = { path = "crates/noonoo-caison", version = "0.0.1" }
noonoo-dom = { path = "crates/noonoo-dom", version = "0.0.1" }
noonoo-events = { path = "crates/noonoo-events", version = "0.0.1" }
noonoo-text = { path = "crates/noonoo-text", version = "0.0.1" }
noonoo-motion = { path = "crates/noonoo-motion", version = "0.0.1" }
noonoo-style = { path = "crates/noonoo-style", version = "0.0.1" }
noonoo-layout = { path = "crates/noonoo-layout", version = "0.0.1" }
noonoo-html = { path = "crates/noonoo-html", version = "0.0.1" }
noonoo-net = { path = "crates/noonoo-net", version = "0.0.1" }
noonoo-engine = { path = "crates/noonoo-engine", version = "0.0.1" }
noonoo-headless = { path = "crates/noonoo-headless", version = "0.0.1" }
noonoo-paint = { path = "crates/noonoo-paint", version = "0.0.1" }
noonoo-shell = { path = "crates/noonoo-shell", version = "0.0.1" }

[profile.release]
lto = true
codegen-units = 1
strip = true
